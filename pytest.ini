[pytest]
# C1 test modules are named `build-dataset.test.py`. Teach pytest to discover
# that pattern and to import by file path, so the plan's frozen verify command
# (`python -m pytest scripts/build-dataset.test.py`) resolves without treating
# the dotted basename as a package path.
python_files = *.test.py test_*.py *_test.py
addopts = --import-mode=importlib
